<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <!-- 設定文件編碼為 UTF-8，支援繁體中文 -->
    <meta charset="UTF-8">
    <!-- 確保網頁在行動裝置上能適應螢幕大小 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 設定網頁標題 -->
    <title>RGB 桌燈控制</title>
    <style>
        /* 設定整體頁面樣式 */
        body {
            /* 使用 Arial 字體，若不可用則使用 sans-serif */
            font-family: Arial, sans-serif;
            /* 使內容在頁面中垂直和水平居中 */
            display: flex;
            justify-content: center;
            align-items: center;
            /* 設定頁面高度為視窗的 100% */
            height: 100vh;
            /* 移除預設外邊距 */
            margin: 0;
            /* 初始背景色為黑色，帶 0.7 透明度，後由 JavaScript 更新 */
            background-color: rgba(0, 0, 0, 0.7);
            /* 背景色過渡動畫，0.3秒 */
            transition: background-color 0.3s;
        }
        /* 定義控制面板容器樣式 */
        .container {
            /* 內容居中對齊 */
            text-align: center;
            /* 設定白色背景，帶 0.85 透明度 */
            background-color: rgba(255, 255, 255, 0.85);
            /* 內邊距為 2rem */
            padding: 2rem;
            /* 圓角邊框 */
            border-radius: 10px;
            /* 添加陰影效果，增加立體感 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        /* 標題樣式 */
        h1 {
            /* 設定文字顏色為深灰色 */
            color: #333;
            /* 底部外邊距為 1.5rem */
            margin-bottom: 1.5rem;
        }
        /* 滑動開關容器樣式 */
        .switch-container {
            /* 上下外邊距 */
            margin: 10px 0;
        }
        /* 滑動開關標籤樣式 */
        .switch-label {
            /* 文字大小 */
            font-size: 16px;
            /* 文字顏色 */
            color: #333;
            /* 右邊距 */
            margin-right: 10px;
        }
        /* 滑動開關樣式 */
        .switch {
            /* 設定相對定位 */
            position: relative;
            /* 設定為行內塊狀元素 */
            display: inline-block;
            /* 開關寬度 */
            width: 60px;
            /* 開關高度 */
            height: 34px;
        }
        /* 隱藏預設的 checkbox */
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        /* 滑塊背景樣式 */
        .slider {
            /* 絕對定位，填滿開關 */
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* 預設背景色為灰色 */
            background-color: #ccc;
            /* 圓角 */
            border-radius: 34px;
            /* 過渡動畫 */
            transition: background-color 0.3s;
        }
        /* 滑塊圓點樣式 */
        .slider:before {
            /* 絕對定位 */
            position: absolute;
            /* 圓點大小 */
            content: "";
            height: 26px;
            width: 26px;
            /* 左邊距 */
            left: 4px;
            /* 底部對齊 */
            bottom: 4px;
            /* 白色圓點 */
            background-color: white;
            /* 圓角 */
            border-radius: 50%;
            /* 過渡動畫 */
            transition: transform 0.3s;
        }
        /* 選中狀態的滑塊背景 */
        input:checked + .slider {
            /* 紅光滑塊 */
            background-color: #ff0000;
        }
        /* 綠光滑塊選中狀態 */
        input.green:checked + .slider {
            background-color: #00ff00;
        }
        /* 藍光滑塊選中狀態 */
        input.blue:checked + .slider {
            background-color: #0000ff;
        }
        /* 選中狀態的滑塊圓點 */
        input:checked + .slider:before {
            /* 移動到右側 */
            transform: translateX(26px);
        }
    </style>
</head>
<body>
    <!-- 控制面板容器 -->
    <div class="container">
        <!-- 顯示標題 -->
        <h1>RGB 桌燈控制</h1>
        <!-- 紅光滑動開關 -->
        <div class="switch-container">
            <span class="switch-label">紅光</span>
            <label class="switch">
                <input type="checkbox" id="redSwitch" onchange="controlLed('r', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <!-- 綠光滑動開關 -->
        <div class="switch-container">
            <span class="switch-label">綠光</span>
            <label class="switch">
                <input type="checkbox" id="greenSwitch" class="green" onchange="controlLed('g', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <!-- 藍光滑動開關 -->
        <div class="switch-container">
            <span class="switch-label">藍光</span>
            <label class="switch">
                <input type="checkbox" id="blueSwitch" class="blue" onchange="controlLed('b', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
    </div>
    <script>
        // 旗標控制是否允許狀態查詢
        let isUpdating = false;

        // 控制 LED 的函式，發送 AJAX 請求
        function controlLed(color, checked) {
            isUpdating = true; // 暫停自動查詢
            const status = checked ? 'on' : 'off';
            fetch(`/led?color=${color}&status=${status}`)
                .then(response => {
                    if (!response.ok) throw new Error('控制失敗');
                    // 延遲 0.5 秒後恢復查詢
                    setTimeout(() => {
                        isUpdating = false;
                        updateStatus();
                    }, 500);
                })
                .catch(error => {
                    console.error('錯誤:', error);
                    isUpdating = false; // 即使失敗也恢復查詢
                });
        }

        // 更新滑動開關狀態和背景色的函式
        function updateStatus() {
            if (isUpdating) {
                // 若正在處理控制請求，延遲 1 秒後重試
                setTimeout(updateStatus, 1000);
                return;
            }
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    // 更新滑動開關狀態
                    document.getElementById('redSwitch').checked = data.r === 1;
                    document.getElementById('greenSwitch').checked = data.g === 1;
                    document.getElementById('blueSwitch').checked = data.b === 1;
                    // 更新背景色，LED 值為 0 或 1，轉為 0 或 255，透明度 0.7
                    const rValue = data.r * 255;
                    const gValue = data.g * 255;
                    const bValue = data.b * 255;
                    document.body.style.backgroundColor = `rgba(${rValue}, ${gValue}, ${bValue}, 0.7)`;
                    // 1 秒後再次呼叫 updateStatus
                    setTimeout(updateStatus, 1000);
                })
                .catch(error => {
                    console.error('狀態查詢錯誤:', error);
                    // 若錯誤，1 秒後仍嘗試再次更新
                    setTimeout(updateStatus, 1000);
                });
        }

        // 頁面載入時立即更新狀態
        window.onload = updateStatus;
    </script>
</body>
</html>
